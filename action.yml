name: Steam Stats Card
description: Generate a Steam profile card for your GitHub README
branding:
  icon: image
  color: green
inputs:
  steam-api-key:
    description: Steam Web API key (pass a GitHub Actions secret); not needed for demo
    required: false
  igdb-client-id:
    description: Optional Twitch client ID for IGDB favorites
    required: false
  igdb-client-secret:
    description: Optional Twitch client secret for IGDB favorites
    required: false
  config:
    description: Configuration path relative to the checked-out repository
    default: steam-stats.yml
  output:
    description: PNG path relative to the checked-out repository
    default: assets/steam-card.png
  demo:
    description: Generate fictional sample data without network or an API key
    default: 'false'
outputs:
  changed:
    description: Whether the output PNG changed
    value: ${{ steps.generate.outputs.changed }}
  path:
    description: Generated PNG path relative to the repository
    value: ${{ steps.generate.outputs.path }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 11.1.2
        run_install: false
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Build generator
      shell: bash
      working-directory: ${{ github.action_path }}
      run: node node_modules/typescript/bin/tsc
    - name: Generate card
      id: generate
      shell: bash
      env:
        STEAM_API_KEY: ${{ inputs.steam-api-key }}
        IGDB_CLIENT_ID: ${{ inputs.igdb-client-id }}
        IGDB_CLIENT_SECRET: ${{ inputs.igdb-client-secret }}
        CARD_CONFIG: ${{ inputs.config }}
        CARD_OUTPUT: ${{ inputs.output }}
        CARD_DEMO: ${{ inputs.demo }}
      run: node "$GITHUB_ACTION_PATH/dist/src/action-entry.js"
