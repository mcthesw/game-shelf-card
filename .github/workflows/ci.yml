name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run demo
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./
        id: first
        with:
          config: examples/demo.yml
          output: generated/action-demo.png
          demo: 'true'
      - uses: ./
        id: second
        with:
          config: examples/demo.yml
          output: generated/action-demo.png
          demo: 'true'
      - name: Verify idempotence
        env:
          FIRST_CHANGED: ${{ steps.first.outputs.changed }}
          SECOND_CHANGED: ${{ steps.second.outputs.changed }}
        run: |
          test "$FIRST_CHANGED" = true
          test "$SECOND_CHANGED" = false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sample-card
          path: generated/action-demo.png
